name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format valgrind lcov ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler}} \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Format check
        run: cmake --build build --target format

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Tidy
        run: cmake --build build --target tidy

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-asan-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-asan-

      - name: Configure with ASan
        run: |
          mkdir -p build-asan
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test with ASan
        run: ctest --test-dir build-asan --output-on-failure

  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-ubsan-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-ubsan-

      - name: Configure with UBsan
        run: |
          mkdir -p build-ubsan
          cmake -B build-ubsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DCOBALT_RUN_TIDY=OFF \
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build
        run: cmake --build build-ubsan --parallel

      - name: Test with UBsan
        run: ctest --test-dir build-ubsan --output-on-failure

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format valgrind ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-valgrind-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-valgrind-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Valgrind
        run: valgrind --leak-check=full --error-exitcode=1 build/tests/cobalt_test

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-bench-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-bench-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build 
            -DCMAKE_BUILD_TYPE=Release 
            -DCMAKE_C_COMPILER=clang 
            -DCOBALT_RUN_TIDY=OFF 
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run benchmarks
        run: build/tests/bench_runner

      - name: Store benchmark baseline
        run: |
          mkdir -p .benchmarks
          build/tests/bench_runner > .benchmarks/baseline.txt
          cat .benchmarks/baseline.txt

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/baseline.txt

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-coverage-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-coverage-

      - name: Configure with coverage
        run: |
          mkdir -p build-cov
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCOBALT_BUILD_COVERAGE=ON \
            -DCOBALT_RUN_TIDY=OFF \
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build and run tests
        run: cmake --build build-cov --parallel

      - name: Generate coverage report
        run: cmake --build build-cov --target coverage-summary

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/coverage_report/

  abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-abi-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-abi-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCOBALT_RUN_TIDY=OFF \
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Dump ABI symbols
        run: |
          nm build/libcobalt.a | grep " T cobalt_" | sort > .abi-snapshot.txt
          echo "Total exported cobalt_* symbols: $(wc -l < .abi-snapshot.txt)"
          cat .abi-snapshot.txt

      - name: Upload ABI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: abi-snapshot
          path: .abi-snapshot.txt
