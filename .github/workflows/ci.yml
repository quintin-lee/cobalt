name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format valgrind lcov ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler}} \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Format check
        run: cmake --build build --target format

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Tidy
        run: cmake --build build --target tidy

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-asan-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-asan-

      - name: Configure with ASan
        run: |
          mkdir -p build-asan
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test with ASan
        run: ctest --test-dir build-asan --output-on-failure --timeout 120
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/lsan.suppress

  ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-ubsan-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-ubsan-

      - name: Configure with UBsan
        run: |
          mkdir -p build-ubsan
          cmake -B build-ubsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DCOBALT_RUN_TIDY=OFF \
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build
        run: cmake --build build-ubsan --parallel

      - name: Test with UBsan
        run: ctest --test-dir build-ubsan --output-on-failure

  # ---- Cross-platform build & test ----
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v7

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler}}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v7

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure (MinGW)
        run: |
          mkdir build
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} `
            -DCMAKE_GENERATOR="MinGW Makefiles"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- ABI regression gate ----
  abi-check:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-abi-check-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-abi-check-
            ${{ runner.os }}-ccache-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build --parallel

      - name: Dump current ABI symbols
        run: nm build/libcobalt.a | grep " T cobalt_" | sort > .abi-current.txt

      - name: Download previous ABI snapshot
        uses: actions/download-artifact@v4
        with:
          name: abi-snapshot
          path: .github/
        continue-on-error: true

      - name: Compare ABI
        run: |
          if [ ! -f .github/abi-snapshot.txt ]; then
            echo "No previous ABI snapshot found — recording as baseline."
            mkdir -p .github
            cp .abi-current.txt .github/abi-snapshot.txt
            exit 0
          fi
          added=$(comm -13 .github/abi-snapshot.txt .abi-current.txt)
          removed=$(comm -23 .github/abi-snapshot.txt .abi-current.txt)
          if [ -n "$removed" ]; then
            echo "ERROR: Removed cobalt_* symbols are ABI-breaking:"
            echo "$removed"
            exit 1
          fi
          if [ -n "$added" ]; then
            echo "WARNING: New cobalt_* symbols added (review for ABI stability):"
            echo "$added"
          else
            echo "ABI stable: no symbol changes."
          fi

      - name: Upload current snapshot
        uses: actions/upload-artifact@v4
        with:
          name: abi-snapshot
          path: .abi-current.txt

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format valgrind ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-valgrind-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-valgrind-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCOBALT_RUN_TIDY=ON \
            -DCOBALT_RUN_FORMAT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run Valgrind
        run: valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect,possible --error-exitcode=1 build/tests/cobalt_test

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format ccache python3

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-bench-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-bench-

      - name: Configure
        run: |
          mkdir -p build
          cmake -B build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER=clang             -DCOBALT_RUN_TIDY=OFF             -DCOBALT_RUN_FORMAT=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          build/tests/bench_runner --json > .benchmarks/result.json

      - name: Download previous baseline
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/
        continue-on-error: true

      - name: Compare against baseline
        run: |
          if [ -f .benchmarks/baseline.json ]; then
            python3 -c "
            import json, sys
            with open('.benchmarks/baseline.json') as f:
                base = {b['name']: b['mean_ms'] for b in json.load(f)['benchmarks']}
            with open('.benchmarks/result.json') as f:
                curr = {b['name']: b['mean_ms'] for b in json.load(f)['benchmarks']}
            regressed = []
            for name, cur_ms in curr.items():
                if name in base and base[name] > 0:
                    pct = (cur_ms - base[name]) / base[name] * 100
                    if pct > 5:
                        regressed.append((name, base[name], cur_ms, pct))
            if regressed:
                print('WARNING: Performance regression detected!')
                for name, old_ms, new_ms, pct in regressed:
                    print(f'  {name}: {old_ms:.3f}ms -> {new_ms:.3f}ms (+{pct:.1f}%)')
                sys.exit(1)
            else:
                print('No significant regression detected.')
            "
          else
            echo 'No baseline found, skipping regression check.'
          fi

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/result.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov ccache

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-coverage-${{ hashFiles('**/*.c', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-coverage-

      - name: Configure with coverage
        run: |
          mkdir -p build-cov
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCOBALT_BUILD_COVERAGE=ON \
            -DCOBALT_RUN_TIDY=OFF \
            -DCOBALT_RUN_FORMAT=OFF

      - name: Build and run tests
        run: cmake --build build-cov --parallel

      - name: Generate coverage report
        run: cmake --build build-cov --target coverage-check

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/coverage_report/
